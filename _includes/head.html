<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1. The Title Tag: Shows up as the clickable blue headline in Google -->
  <title>Ana Fernández Baranda </title>

  <!-- 2. Meta Description: The snippet text shown beneath the title -->
  <meta name="description" content="Personal webpage">

  <!-- 3. Canonical URL: Tells Google this is the authoritative master link -->
  <link rel="canonical" href="https://ana-fernandezbaranda.github.io/">

  <!-- 4. Open Graph Meta: Controls link previews when shared on LinkedIn, Discord, etc. -->
  <meta property="og:title" content="Ana Fernández Baranda">
  <meta property="og:description" content="Personal website">
  <meta property="og:url" content="https://ana-fernandezbaranda.github.io/">
  <meta property="og:type" content="website">
</head>
<body>
  <!-- Page Content -->
</body>
</html>
